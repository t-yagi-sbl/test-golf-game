<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ゴルフ ニアピンゲーム</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --ui-bg: #2c3e50;
            --accent-red: #e74c3c;
            --target-blue: #3498db;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        #game-area {
            position: relative;
            width: 100%;
            flex: 1;
            background-color: #87CEEB;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #message {
            font-size: clamp(24px, 8vw, 40px);
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 8px #000;
            text-align: center;
            display: none;
            z-index: 100;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            width: 80%;
        }

        #controls {
            background: var(--ui-bg);
            padding: 15px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        .info-panel {
            text-align: center;
            font-size: 15px;
            line-height: 1.5;
        }

        #power-bar-container {
            width: 100%;
            height: 35px;
            background: #1a252f;
            border: 2px solid #7f8c8d;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
        }

        #target-line {
            position: absolute;
            left: 83.3%;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--target-blue);
            z-index: 10;
            box-shadow: 0 0 10px var(--target-blue);
        }

        #power-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: white;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="game-area">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="message"></div>
        </div>
    </div>

    <div id="controls">
        <div class="info-panel">
            目標: 150Y / クラブ: 7番アイアン<br>
            <strong id="score-text" style="color: #FFD700;">タップでパワー決定スタート！</strong>
        </div>
        <div id="power-bar-container">
            <div id="target-line"></div>
            <div id="power-bar"></div>
        </div>
        <button id="action-btn">スタート</button>
    </div>

    <script>
        const TARGET_YARD = 150; 
        const MAX_YARD = 180;    
        
        let state = 'ready'; 
        let power = 0;
        let powerDirection = 1;
        let hitYard = 0;
        let flyProgress = 0;
        let ballTargetY = 0;
        let isHoleInOne = false;

        let clouds = [];
        let trees = [];
        let confettis = [];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const powerBar = document.getElementById('power-bar');
        const actionBtn = document.getElementById('action-btn');
        const messageEl = document.getElementById('message');
        const scoreText = document.getElementById('score-text');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            initClouds();
            initTrees();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

        function initClouds() {
            clouds = [];
            for (let i = 0; i < 4; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.2),
                    speed: 0.3 + Math.random() * 0.5,
                    scale: 0.6 + Math.random() * 0.6
                });
            }
        }

        function initTrees() {
            trees = [];
            const horizonY = canvas.height * 0.2;
            for (let i = 0; i <= canvas.width; i += 50) {
                trees.push({ x: i, h: 15 + Math.random() * 25 });
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > canvas.width + 60) c.x = -100;
            });

            if (state === 'power') {
                power += 2.2 * powerDirection; 
                if (power > 100) { power = 100; powerDirection = -1; } 
                else if (power < 0) { power = 0; powerDirection = 1; }
                powerBar.style.width = power + '%';
            } 
            else if (state === 'fly') {
                flyProgress += 0.02; 
                if (flyProgress >= 1) {
                    flyProgress = 1;
                    state = 'result';
                    showResult();
                }
            }

            if (confettis.length > 0) {
                confettis.forEach(c => {
                    c.x += c.vx;
                    c.vy += 0.35;
                    c.y += c.vy;
                });
                if (confettis.length > 200) confettis.splice(0, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 空
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.4);
            skyGrad.addColorStop(0, '#1E90FF'); 
            skyGrad.addColorStop(1, '#87CEFA'); 
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 雲
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 20 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 15 * c.scale, c.y - 10 * c.scale, 15 * c.scale, 0, Math.PI * 2);
                ctx.arc(c.x + 30 * c.scale, c.y, 15 * c.scale, 0, Math.PI * 2);
                ctx.fill();
            });

            const horizonY = canvas.height * 0.2;
            ctx.fillStyle = '#2E481A';
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            ctx.fillStyle = '#003300';
            trees.forEach(t => {
                ctx.beginPath();
                ctx.moveTo(t.x, horizonY + 10);
                ctx.lineTo(t.x + 15, horizonY - t.h);
                ctx.lineTo(t.x + 30, horizonY + 10);
                ctx.fill();
            });

            const cupY = canvas.height * 0.25;
            const teeY = canvas.height * 0.85;
            const greenW = canvas.width * 0.65;
            const greenH = greenW * 0.4;

            // グリーン
            const greenGrad = ctx.createRadialGradient(canvas.width/2, cupY, 0, canvas.width/2, cupY, greenW/2);
            greenGrad.addColorStop(0, '#228B22');
            greenGrad.addColorStop(1, '#004d00');
            ctx.fillStyle = greenGrad;
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, cupY, greenW/2, greenH/2, 0, 0, Math.PI * 2);
            ctx.fill();

            // カップの穴
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, cupY, 10, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // ピン
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, cupY);
            ctx.lineTo(canvas.width/2, cupY - 45);
            ctx.stroke();
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, cupY - 45);
            ctx.lineTo(canvas.width/2 + 20, cupY - 35);
            ctx.lineTo(canvas.width/2, cupY - 25);
            ctx.fill();

            // ボールの描画
            let currentGroundY = teeY;
            if (state === 'fly' || state === 'result') {
                currentGroundY = teeY - (teeY - ballTargetY) * flyProgress;
            }
            
            // 弧を描く高さ
            let arcH = Math.sin(flyProgress * Math.PI) * (teeY - cupY) * 0.5;
            let ballY = currentGroundY - arcH;
            
            // ホールインワン演出：最後の最後で穴の中に消える
            let ballOpacity = 1;
            if (isHoleInOne && flyProgress > 0.95) {
                ballOpacity = 1 - (flyProgress - 0.95) * 20; 
                ballY += (flyProgress - 0.95) * 100; // 穴の下に落ちる動き
            }

            const scale = 0.4 + (currentGroundY / canvas.height) * 0.6;

            // 影（ホールインワンなら穴付近で消す）
            if (ballOpacity > 0) {
                ctx.fillStyle = `rgba(0,0,0,${0.3 * ballOpacity})`;
                ctx.beginPath();
                ctx.ellipse(canvas.width/2, currentGroundY, 10 * scale, 4 * scale, 0, 0, Math.PI * 2);
                ctx.fill();

                // ボール
                ctx.fillStyle = `rgba(255,255,255,${ballOpacity})`;
                ctx.beginPath();
                ctx.arc(canvas.width/2, ballY, 7 * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            // 紙吹雪
            confettis.forEach(c => {
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function showResult() {
            const diffYard = Math.abs(TARGET_YARD - hitYard);
            let resultText = "";
            let subText = `残り ${diffYard.toFixed(1)} ヤード`;
            let confettiCount = 0;

            if (diffYard <= 1.2) {
                isHoleInOne = true;
                resultText = "🎉 ホールインワン！ 🎉";
                subText = `奇跡のショット！ (${diffYard.toFixed(2)}Y)`;
                confettiCount = 150;
            } else if (diffYard < 78) {
                resultText = "⛳️ NICE ON! ⛳️";
                subText = `ナイスオン！ 残り ${diffYard.toFixed(1)}Y`;
                confettiCount = 50;
            } else {
                messageEl.style.display = "none";
                scoreText.innerText = subText;
            }

            if (resultText !== "") {
                messageEl.innerHTML = resultText;
                messageEl.style.display = "block";
                scoreText.innerText = subText;
                for (let i = 0; i < confettiCount; i++) {
                    confettis.push({
                        x: canvas.width / 2,
                        y: canvas.height * 0.25,
                        vx: (Math.random() - 0.5) * 14,
                        vy: (Math.random() - 1) * 16,
                        color: `hsl(${Math.random() * 360}, 80%, 50%)`,
                        size: 2 + Math.random() * 4
                    });
                }
            }
            actionBtn.innerText = "もう一度プレイ";
        }

        function handleAction() {
            if (state === 'ready') {
                state = 'power';
                power = 0;
                isHoleInOne = false;
                messageEl.style.display = "none";
                confettis = [];
                scoreText.innerText = "青い線のタイミングでタップ！";
                actionBtn.innerText = "ショット！";
            } 
            else if (state === 'power') {
                state = 'fly';
                hitYard = MAX_YARD * (power / 100);
                const teeY = canvas.height * 0.85;
                const cupY = canvas.height * 0.25;
                ballTargetY = teeY - (hitYard * ((teeY - cupY) / TARGET_YARD));
                flyProgress = 0;
                actionBtn.innerText = "飛んでいます...";
            }
            else if (state === 'result') {
                state = 'ready';
                powerBar.style.width = '0%';
                scoreText.innerText = "タップでパワー決定スタート！";
                actionBtn.innerText = "スタート";
                confettis = [];
                isHoleInOne = false;
            }
        }

        actionBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleAction();
        });

        resizeCanvas();
        gameLoop();
    </script>
</body>
</html>
